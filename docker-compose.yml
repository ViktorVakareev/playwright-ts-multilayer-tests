# Local PostgreSQL with the seeded schema. The app itself is started by Playwright (webServer in playwright.config.ts).
#   docker compose up -d     ->  database on localhost:5432
#   docker compose down -v   ->  stop and wipe it
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa          # local practice database only
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d servicedesk"]
      interval: 5s
      timeout: 3s
      retries: 10
