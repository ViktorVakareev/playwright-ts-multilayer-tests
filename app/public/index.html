<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Requests</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 2rem; color: #1b1b1b; }
    form { display: grid; grid-template-columns: 8rem 18rem; gap: .5rem 1rem; margin-bottom: 1.5rem; }
    .error { color: #b00020; min-height: 1.2rem; }
    table { border-collapse: collapse; min-width: 44rem; }
    th, td { border: 1px solid #ccc; padding: .35rem .6rem; text-align: left; }
    th { background: #f3f3f3; }
  </style>
</head>
<body>
  <h1>Service Requests</h1>

  <form data-testid="create-form">
    <label for="customer">Customer</label>
    <select id="customer" data-testid="customer-select"></select>
    <label for="title">Title</label>
    <input id="title" data-testid="title-input" maxlength="120">
    <label for="amount">Amount (EUR)</label>
    <input id="amount" data-testid="amount-input" inputmode="decimal">
    <span></span>
    <button type="submit" data-testid="submit-button">Submit request</button>
  </form>

  <p>Last created request: <strong data-testid="created-id"></strong></p>
  <p class="error" data-testid="form-error" role="alert"></p>

  <table data-testid="requests-table">
    <thead>
      <tr><th>ID</th><th>Title</th><th>Amount</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const $ = (id) => document.querySelector(`[data-testid="${id}"]`);

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
    const body = res.status === 204 ? null : await res.json();
    if (!res.ok) throw new Error(body?.error ?? `HTTP ${res.status}`);
    return body;
  }

  async function loadCustomers() {
    const customers = await api('/api/customers');
    $('customer-select').innerHTML = customers
      .map(c => `<option value="${c.id}">${c.name}${c.isActive ? '' : ' (inactive)'}</option>`)
      .join('');
  }

  async function loadRequests() {
    const rows = await api('/api/requests');
    document.querySelector('[data-testid="requests-table"] tbody').innerHTML = rows.map(r => `
      <tr data-testid="request-row-${r.id}">
        <td>${r.id}</td>
        <td>${r.title.replace(/</g, '&lt;')}</td>
        <td>${r.amount.toFixed(2)}</td>
        <td data-testid="status-${r.id}">${r.status}</td>
        <td>
          ${r.status === 'PendingApproval' ? `<button data-testid="approve-${r.id}" onclick="act(${r.id}, 'approve')">Approve</button>` : ''}
          ${r.status === 'Approved' ? `<button data-testid="fulfil-${r.id}" onclick="act(${r.id}, 'fulfil')">Fulfil</button>` : ''}
        </td>
      </tr>`).join('');
  }

  async function act(id, action) {
    $('form-error').textContent = '';
    try {
      await api(`/api/requests/${id}/${action}`, { method: 'POST' });
      await loadRequests();
    } catch (e) {
      $('form-error').textContent = e.message;
    }
  }

  $('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('form-error').textContent = '';
    try {
      const created = await api('/api/requests', {
        method: 'POST',
        body: JSON.stringify({
          customerId: Number($('customer-select').value),
          title: $('title-input').value,
          amount: Number($('amount-input').value)
        })
      });
      $('created-id').textContent = created.id;
      await loadRequests();
    } catch (err) {
      $('form-error').textContent = err.message;
    }
  });

  loadCustomers().then(loadRequests);
</script>
</body>
</html>
